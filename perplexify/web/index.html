<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Perplexify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316171b'/%3E%3Cpath d='M16 8 5 10v13l11-2 11 2V10z' fill='%23e3e4e8'/%3E%3Cpath d='M9 24l4 2-4 2zm6 3h6v2h-6z' fill='%233fb8cc'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="history.css">
<link rel="stylesheet" href="bookmarks.css">
<link rel="stylesheet" href="local.css">
<script>
  // choose the theme before the first paint so there is no flash
  (function () {
    // Dark is the default, whatever the system setting is. Only a choice made with the switch in the top bar changes it.
    var t = null;
    try { t = localStorage.getItem('perplexify.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'dark';
    document.documentElement.dataset.theme = t;
    var r = null;
    try { r = localStorage.getItem('perplexify.read'); } catch (e) {}
    document.documentElement.dataset.read = r === 'serif' ? 'serif' : 'sans';
  })();
</script>
</head>
<body>
<div id="app" class="app">
  <header class="top" id="top"></header>
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <div class="viewtabs" id="viewtabs" role="tablist"></div>
    <div class="banner" id="banner" hidden></div>
    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="composer" id="composer"></div>
    <section class="sv" id="searchview" hidden></section>
    <section class="sv" id="bookmarksview" hidden></section>
    <section class="sv" id="historyview" hidden></section>
    <section class="viewer" id="viewer" hidden></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="js/core.js"></script>
<script src="js/shell.js"></script>
<script src="js/chat.js"></script>
<script src="js/search.js"></script>
<script src="js/history.js"></script>
<script src="js/bookmarks.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/local.js"></script>
<script src="js/main.js"></script>
</body>
</html>
